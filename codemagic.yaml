workflows:
  ios-unsigned:
    name: StocksLive unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Build unsigned ipa
        script: |
          chmod +x build-ipa.sh
          ./build-ipa.sh
    artifacts:
      - build/StocksLive-unsigned.ipa
