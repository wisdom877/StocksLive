name: StocksLive

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    HEADER_SEARCH_PATHS: $(SRCROOT)/App/CarPlay/Protocol/Crypto/include
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  StocksLive:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stocks
        PRODUCT_NAME: StocksLive
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/StocksLive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/CarPlay/CarPlay-Bridging-Header.h
        CURRENT_PROJECT_VERSION: "50"
    dependencies:
      - target: DndLiveWidget
        embed: true
      - sdk: HealthKit.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreBluetooth.framework

  DndLiveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stocks.DndLiveWidget
        PRODUCT_NAME: DndLiveWidget
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  StocksLive:
    build:
      targets:
        StocksLive: all
    run:
      config: Debug
    archive:
      config: Release
