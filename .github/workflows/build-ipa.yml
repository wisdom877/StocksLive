name: build-unsigned-ipa

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Web 源码语法检查
        run: |
          python3 -m compileall -q web
          for f in web/static/app-*.js; do node --check "$f"; done

  build:
    needs: web-check
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 xcodegen
        run: brew install xcodegen
      - name: 构建未签名 ipa
        env:
          CARPLAY_CERT_B64: ${{ secrets.CARPLAY_CERT_B64 }}
          CARPLAY_LEAF_B64: ${{ secrets.CARPLAY_LEAF_B64 }}
          CARPLAY_KEY_B64: ${{ secrets.CARPLAY_KEY_B64 }}
        run: chmod +x build-ipa.sh && ./build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StocksLive-unsigned-ipa
          path: build/StocksLive-unsigned.ipa
          retention-days: 14
