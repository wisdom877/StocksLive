name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 安装 xcodegen
        run: brew install xcodegen
      - name: 构建未签名 ipa
        run: chmod +x build-ipa.sh && ./build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StocksLive-unsigned-ipa
          path: build/StocksLive-unsigned.ipa
