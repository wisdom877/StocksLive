<script>/* 主题先定：某些 WebView 不上报 prefers-color-scheme，页面自己把 html[data-theme] 摆好，
   后面的 CSS 只按这个属性取色，系统外观只在「跟随系统」时作为初值 */
(function(){var m="auto";try{m=localStorage.getItem("appTheme")||"auto"}catch(e){}
var d=m==="dark"||(m!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",d?"dark":"light");})();</script>
<link rel="stylesheet" href="static/style.css?v=101">
</head>
<body>
<script>
/* 启动兜底：外链脚本被 WebView 缓存成半截或网络打断时，页面会永久停在「正在加载…」。
   这里用内联脚本（不依赖外链）做一个硬超时：10s 没进界面就自动重载一次，
   再不行就明确报失败，至少不会一直转圈。 */
window.__bootGuard = setTimeout(function () {
  var sp = document.getElementById("splash");
  if (!sp) return;
  var tip = sp.querySelector(".sp-tip");
  var n = +(sessionStorage.getItem("bootReload") || 0);
  if (n < 1) {
    sessionStorage.setItem("bootReload", "1");
    if (tip) tip.textContent = "载入超时，正在重新载入…";
    setTimeout(function () { location.reload(); }, 1200);
  } else if (tip) {
    tip.textContent = "载入失败，关掉 App 重新打开";
  }
}, 10000);
</script>

    <button data-view="hold" class="on"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5 9 11l4 4.2 7-7.7" stroke-linecap="round"/><path d="M4 20.5h16" stroke-linecap="round" opacity=".45"/></svg></i><span>行情</span></button>
    <!-- 用户点新闻频率更高：新闻放到底部第三格（原记录的位置），记录入口移到顶栏 ✎ -->
    <button data-view="work" id="tab-work"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="6.6" width="17.2" height="12.8" rx="3"/><path d="M8.6 6.6V4.9h6.8v1.7M3.4 12h17.2" stroke-linecap="round"/></svg></i><span>工作</span></button>
    <button id="tab-news" type="button"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.6" y="5" width="16.8" height="14" rx="2.6"/><path d="M6.8 9.4h10M6.8 12.6h10M6.8 15.8h6" stroke-linecap="round"/></svg></i><span>新闻</span></button>
  </nav>
</div>

<!-- 全局搜索 -->
<div id="wk-ov" class="wk-ov hidden">
  <!-- 顶栏跟行情/工作页同一套：整条透明，只有图标自带胶囊底，反着压一层实底就等于另一个标准 -->
  <header class="topbar wk-ov-nav">
    <div class="top-left">
      <button type="button" class="icon-btn" id="wk-ov-back" title="返回工作" aria-label="返回工作"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.4 4.4 6.8 10l5.6 5.6"/></svg></button>
    </div>
    <div class="wk-ov-t"><span class="wk-ov-h">数据总览</span><span class="wk-ov-sum" id="wk-ov-sum"></span></div>
    <div class="top-right">
      <button type="button" class="icon-btn" id="wk-ov-ai" title="AI 筛选" aria-label="AI 筛选"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.7 4.3L18 9.6l-4.3 1.7L12 15.6l-1.7-4.3L6 9.6l4.3-1.7z"/><path d="M18.4 15.2l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg></button>
    </div>
  </header>
  <div class="wk-ov-body">
    <!-- 筛选条整块浮起：往下滑的时候范围/模式/指标不动 -->
    <div class="wk-ov-fil" id="wk-ov-fil">
      <div class="chips wk-ov-chips" id="wk-ov-range"></div>
      <div class="chips wk-ov-chips wk-ov-modechips" id="wk-ov-modes"></div>
      <div class="chips wk-ov-chips" id="wk-ov-metric"></div>
    </div>
    <!-- 只有热力图这块滚，筛选条在上面不动（等于悬浮的导航栏） -->
    <div class="wk-ov-scroll">
      <div class="wk-heat" id="wk-ov-heat"></div>
      <div class="wk-ov-legend" id="wk-ov-legend"></div>
      <div class="wk-ov-stat" id="wk-ov-stat"></div>
      <div class="wk-ov-hint" id="wk-ov-hint"></div>
    </div>
  </div>
</div>
<div id="gsearch" class="gsearch hidden">
  <div class="gs-head">
    <div class="search-wrap">
      <input id="gs-input" type="search" placeholder="搜索代码、基金或新闻" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="btn ghost small" id="gs-cancel">取消</button>
  </div>
  <div id="gs-info" class="tiny muted gs-info"></div>
  <div id="gs-body" class="gs-body"></div>
</div>

<!-- 新闻页：和行情/自选一样保留顶栏、底栏；搜索图标并入标签行 -->
<div id="digest" class="gsearch hidden">
  <div class="dg-head" id="dg-head">
  <div class="chips dg-tabs" id="dg-tabs">
    <button class="chip on" data-dgtab="digest">总结</button>
    <!-- 原来「未读 / 已读」两页其实是一份列表的两种过滤，合并成一条资讯时间流 -->
    <button class="chip" data-dgtab="inbox">资讯 <span id="dg-unread-n">0</span></button>
    <button class="icon-btn dg-close" id="dg-close" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.9"><path d="M6 6l12 12M18 6l-12 12"/></svg></button>
  </div>
  <div class="chips dg-levels hidden" id="dg-levels"></div>
  <div class="chips dg-slots hidden" id="dg-slots">
    <button type="button" class="chip" data-dgslot="am">早</button>
    <button type="button" class="chip" data-dgslot="pm">晚</button>
    <label class="date-pick" id="dg-date-pick" tabindex="0" title="选择日期">
      <span id="dg-date-label" class="date-pick-text"></span>
      <svg class="date-pick-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
      <input type="date" id="dg-date" class="date-pick-native" tabindex="-1" aria-label="选择日期">
    </label>
  </div>
  </div>
  <div id="dg-newbar" class="dg-newbar hidden"></div>
  <div class="gs-body" id="dg-body"></div>
  <div id="dg-pager" class="dg-pager hidden"></div>
  <!-- 总结朗读：服务端生成 MP3，播放条固定在总结面板底部（底栏上方） -->
  <div id="dg-player" class="dg-player hidden">
    <div class="dgp-head">
      <span class="dgp-title">朗读</span>
      <div class="dgp-scopes">
        <button type="button" class="chip on" data-dgscope="key">重点</button>
        <button type="button" class="chip" data-dgscope="full">全文</button>
      </div>
      <span id="dgp-state" class="tiny muted"></span>
      <button type="button" class="dgp-x" id="dgp-close" aria-label="关闭朗读">✕</button>
    </div>
    <div class="dgp-main">
      <button type="button" class="dgp-play" id="dgp-play" aria-label="播放">▶</button>
      <input type="range" id="dgp-seek" class="dgp-seek" min="0" max="0" value="0" step="0.1" aria-label="播放进度">
      <span id="dgp-time" class="tiny muted">0:00 / 0:00</span>
      <button type="button" class="dgp-rate" id="dgp-rate" aria-label="播放速度">1.0x</button>
    </div>
  </div>
</div>

<!-- 弹层 -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-head"><b id="sheet-title">编辑</b><button class="icon-btn" data-close>✕</button></div>
    <div id="sheet-content"></div>
  </div>
</div>

<!-- 二级弹层：在个股详情等弹层之上打开消息预览，关闭只收起这一层，不会连个股页一起退掉 -->
<div id="sheet2" class="sheet subsheet hidden">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-head"><b id="sheet2-title">预览</b><button class="icon-btn" data-close>✕</button></div>
    <div id="sheet2-content"></div>
  </div>
</div>

<div id="selbar" class="selbar hidden">
  <button class="btn ghost small" id="sel-all">全选</button>
  <span id="sel-count" class="tiny"></span>
  <button class="btn danger small" id="sel-del" disabled>删除</button>
  <button class="btn ghost small" id="sel-cancel">取消</button>
</div>

<!-- 总结正文选中文字后的标注浮条 -->
<div id="dg-markbar" class="dg-markbar hidden">
  <button type="button" data-mk="red">标红</button>
  <button type="button" data-mk="underline">下划线</button>
  <button type="button" data-mk="note">批注</button>
</div>

<div id="toast" class="toast hidden"></div>
<script src="static/app-base.js?v=0" data-app="1"></script>
<script src="static/app-detail.js?v=0"></script>
<script src="static/app-note.js?v=0"></script>
<script src="static/app-tag.js?v=0"></script>
<script src="static/app-trend.js?v=0"></script>
<script src="static/app-chart.js?v=0"></script>
<script src="static/app-work.js?v=0"></script>
<script src="static/app-standby.js?v=0"></script>
<script src="static/app-boot.js?v=0"></script>
</body>
</html>
